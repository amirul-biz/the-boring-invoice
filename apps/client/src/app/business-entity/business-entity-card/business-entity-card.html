<div class="bec-card">

  <!-- Header: avatar + name + edit -->
  <div class="bec-header">
    <div class="bec-avatar">{{ business.businessName.charAt(0).toUpperCase() }}</div>
    <div class="bec-header-info">
      <h3 class="bec-name">{{ business.businessName }}</h3>
      <p class="bec-email">{{ business.businessEmail }}</p>
    </div>
    <button class="bec-edit-btn" type="button" (click)="edit.emit(business)" title="Edit">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </button>
  </div>

  <!-- Info rows -->
  <div class="bec-info">
    <div class="bec-info-row">
      <span class="bec-label">TIN</span>
      <span class="bec-value">{{ business.taxIdentificationNumber }}</span>
    </div>
    <div class="bec-info-row">
      <span class="bec-label">Reg. No.</span>
      <span class="bec-value">{{ business.businessRegistrationNumber }}</span>
    </div>
    <div class="bec-info-row">
      <span class="bec-label">Activity</span>
      <span class="bec-value">{{ business.businessActivityDescription }}</span>
    </div>
    <div class="bec-info-row">
      <span class="bec-label">Category</span>
      <span class="bec-value">{{ business.categoryCode }}</span>
    </div>
  </div>

  <!-- Actions -->
  <div class="bec-separator"></div>
  <div class="bec-actions">
    <button class="bec-btn bec-btn--primary" type="button" (click)="createInvoice.emit(business)">
      Create Invoice
    </button>
    <button class="bec-btn bec-btn--outline" type="button" (click)="viewInvoices.emit(business)">
      View Invoices
    </button>
  </div>

</div>
